[project]
name = "jarvis"
version = "0.1.0"
description = "Personal AI butler - completes assignments, manages emails, calendar, GitHub, finances, and more"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # Async & HTTP
    "httpx>=0.27",
    "aiohttp>=3.9",
    "aiohttp-cors>=0.7",
    "websockets>=12.0",
    # Encryption
    "cryptography>=42.0",
    # age CLI used if available (installed via brew), Fernet fallback otherwise
    # Google APIs
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "google-api-python-client>=2.118",
    # GitHub
    "pygithub>=2.1",
    "gitpython>=3.1",
    # Finance (Plaid, manual fallback)
    "plaid-python>=12.0",
    "yfinance>=0.2",
    # MacOS automation
    "pyobjc-framework-ApplicationServices>=10.2",
    "pyobjc-framework-Cocoa>=10.2",
    "appscript>=1.1.0",
    # Voice (later)
    "openai-whisper>=20231117",
    "pyttsx3>=2.99",
    # Scheduling
    "apscheduler>=3.10",
    # CLI
    "typer>=0.12",
    "rich>=13.7",
    # Logging
    "loguru>=0.7",
    # MCP
    "mcp>=1.0",
    # File watching
    "watchdog>=4.0",
    # Utils
    "tenacity>=8.2",
    "python-dateutil>=2.9",
    "croniter>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
voice = [
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
]
browser = [
    "browser-use>=0.1",
    "playwright>=1.44",
]
bridge = [
    "pvporcupine>=3.0",
    "webrtcvad>=2.0.10",
    "numpy>=1.26",
    "elevenlabs>=0.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PTH", "SIM", "T20", "ARG", "PL", "TRY"]
ignore = ["S101", "B008", "PTH118", "PTH123"]
fixable = ["F", "I", "N", "W", "UP", "B", "C4", "PTH", "SIM", "T20", "ARG", "PL", "TRY"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"